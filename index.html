<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №1 | Инструментарий</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- Навигация по вкладкам -->
    <header class="app-header">
        <h1 class="app-title">Студенческий инструментарий</h1>
        <nav class="tabs-nav">
            <button class="tab-btn active" data-target="calc">🧮 Калькулятор</button>
            <button class="tab-btn" data-target="indicator">📊 Индикатор</button>
            <button class="tab-btn" data-target="titlegen">📄 Титульник</button>
        </nav>
    </header>

    <main class="container">
        <!-- 1. Калькулятор -->
        <section id="calc" class="panel active-panel">
            <div class="calculator">
                <div class="calc-inputs">
                    <input type="text" id="num1" class="calc-input active-input" placeholder="Число 1" readonly>
                    <select id="operator" class="calc-select">
                        <option value="+">+</option>
                        <option value="-">-</option>
                        <option value="*">×</option>
                        <option value="/">÷</option>
                    </select>
                    <input type="text" id="num2" class="calc-input" placeholder="Число 2" readonly>
                </div>

                <div class="calc-result-box">
                    <span>Результат:</span>
                    <div id="result-display" class="result-field">—</div>
                </div>

                <div class="calc-keypad">
                    <button data-val="7">7</button><button data-val="8">8</button><button data-val="9">9</button>
                    <button data-val="4">4</button><button data-val="5">5</button><button data-val="6">6</button>
                    <button data-val="1">1</button><button data-val="2">2</button><button data-val="3">3</button>
                    <button data-val="0" class="key-zero">0</button>
                    <button id="clear-key" class="key-clear">C</button>
                </div>
                <button id="calc-btn" class="action-btn primary-btn">📐 Посчитать</button>
            </div>
        </section>

        <!-- 2. Индикатор -->
        <section id="indicator" class="panel">
            <div class="indicator-card">
                <h2 class="section-title">Стрелочный индикатор (0–10)</h2>
                <div class="range-container" id="range-container">
                    <input type="range" id="range-slider" min="0" max="10" step="1" value="0">
                    <div class="range-ticks">
                        <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span>
                        <span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
                    </div>
                </div>
                <div class="indicator-value-display">Текущее: <span id="range-val-text">0</span></div>
                
                <div class="indicator-keypad">
                    <button data-ind="1">1</button><button data-ind="2">2</button><button data-ind="3">3</button>
                    <button data-ind="4">4</button><button data-ind="5">5</button><button data-ind="6">6</button>
                    <button data-ind="7">7</button><button data-ind="8">8</button><button data-ind="9">9</button>
                    <button data-ind="0">0</button>
                    <button id="set-ind-btn" class="action-btn secondary-btn">⚡ Установить</button>
                </div>
                <p class="hint-text">Введите число кнопками и нажмите «Установить». Если > 5 — сработает индикация.</p>
            </div>
        </section>

        <!-- 3. Генератор титульного листа -->
        <section id="titlegen" class="panel">
            <div class="form-card">
                <h2 class="section-title">Генератор титульного листа</h2>
                <form id="title-form">
                    <div class="form-group">
                        <label for="dept">Кафедра / Институт</label>
                        <input type="text" id="dept" placeholder="Институт цифровых систем" required>
                    </div>
                    <div class="form-group">
                        <label for="grp">Группа</label>
                        <input type="text" id="grp" placeholder="АДБ-22-06" required>
                    </div>
                    <div class="form-group">
                        <label for="student">ФИО студента</label>
                        <input type="text" id="student" placeholder="Иванов И.И." required>
                    </div>
                    <div class="form-group">
                        <label for="teacher">ФИО преподавателя</label>
                        <input type="text" id="teacher" placeholder="Ковалев И.А." required>
                    </div>
                    <button type="submit" class="action-btn generate-btn">🚀 Сгенерировать и перейти</button>
                </form>
            </div>
        </section>
    </main>

    <script src="./script.js"></script>
</body>
</html>
