<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мое Резюме и Анкета</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <section class="resume-card">
            <img src="https://via.placeholder.com/150" alt="Фото профиля" class="profile-img">
            
            <h1 id="userLastName">Иванов</h1>
            <h2 id="userFirstName">Игорь</h2>
            <p class="description">Студент направления «Информационные системы и технологии»</p>
            
            <div class="controls">
                <input type="text" id="lastNameInput" placeholder="Введите новую фамилию">
                <button id="changeNameBtn">Изменить фамилию</button>
            </div>
        </section>

        <section class="table-container">
            <h3>Анкета пользователя</h3>
            <div id="tableOutput">
                <button id="startSurveyBtn">Пройти анкетирование</button>
            </div>
        </section>
    </div>
    <div id="surveyControls" style="display:none; margin-top: 20px;">
        <label><input type="checkbox" class="skill" value="math"> Знание математики</label><br>
        <label><input type="checkbox" class="skill" value="prog"> Знание программирования</label><br>
        <label><input type="checkbox" class="skill" value="edu"> Высшее образование</label><br>
        <p>Комментарий: <input type="text" id="commentInput"></p>
    <button id="submitJobBtn">Меня возьмут</button>
</div>

    <script src="script.js"></script>
</body>
</html>
